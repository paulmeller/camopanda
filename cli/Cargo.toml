[package]
name = "camopanda"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "process", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1"] }
hyper-tungstenite = "=0.30.0"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
bytes = "=1.12.1"
uuid = { version = "=1.27.0", features = ["v4"] }
libc = "=0.2.190"
