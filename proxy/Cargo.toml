[package]
name = "lightpanda-hudsucker-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hudsucker-proxy"
path = "src/main.rs"

[dependencies]
hudsucker = { version = "=0.25.0", default-features = false, features = ["rcgen-ca", "rustls-client"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "process", "time"] }
