[package]
name = "lightpanda-hudsucker-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "hudsucker-proxy"
path = "src/main.rs"

[dependencies]
hudsucker = { version = "=0.25.0", default-features = false, features = ["rcgen-ca", "rustls-client"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "process", "time", "sync"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
http-body-util = "=0.1.5"
hyper-tungstenite = "=0.30.0"
uuid = { version = "=1.27.0", features = ["v4"] }
libc = "=0.2.190"
