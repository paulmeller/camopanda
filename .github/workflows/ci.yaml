name: Checks and releases
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - run: cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fmt --manifest-path cli/Cargo.toml --check
      - run: python3 -m py_compile scripts/build-browser.py
      - run: docker compose --profile sessions config --quiet
      - run: docker compose -f docker-compose.yaml -f docker-compose.build.yaml --profile sessions config --quiet
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64
          - runner: macos-14
            platform: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g agent-browser@0.38.1
      - name: Build macOS browser and CLI
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/build-browser.py --test --test-baseline
          cargo build --manifest-path cli/Cargo.toml --locked --release --bins
          cargo build --manifest-path cli/Cargo.toml --locked --bins
          cp cli/target/release/camopanda cli/target/release/camopanda-gateway dist/
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'
      - name: Build Linux browser image and run upstream tests
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: browser
          load: true
          tags: camopanda:check
          build-args: BROWSER_RUN_TESTS=1
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.arch }}
      - name: Build Linux session image
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          load: true
          tags: camopanda-gateway:check
          build-args: BROWSER_RUN_TESTS=1
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
      - name: Export Linux release binaries and source
        if: runner.os == 'Linux'
        run: |
          test "$(docker image inspect camopanda:check --format '{{.Architecture}}')" = '${{ matrix.arch }}'
          mkdir -p dist/licenses cli/target/debug
          id=$(docker create camopanda:check)
          docker cp "$id:/usr/local/bin/camopanda" dist/
          docker cp "$id:/usr/local/bin/camopanda-gateway" dist/
          docker cp "$id:/usr/local/bin/lightpanda" dist/
          docker cp "$id:/usr/local/share/licenses/lightpanda" dist/licenses/
          docker cp "$id:/usr/local/share/camopanda/lightpanda-source.tar.gz" dist/
          docker cp "$id:/usr/local/share/camopanda/browser-pins.json" dist/
          docker rm "$id"
          cp dist/camopanda dist/camopanda-gateway cli/target/debug/
          docker save camopanda:check camopanda-gateway:check | gzip > dist/images-${{ matrix.arch }}.tar.gz
      - name: Direct header and lifecycle checks
        env:
          LIGHTPANDA_BIN: ${{ github.workspace }}/dist/lightpanda
        run: |
          node scripts/header-smoke.mjs
          LOCK_PROFILE=1 node scripts/header-smoke.mjs
          TEST_AGENT_BROWSER=1 node scripts/session-smoke.mjs
      - name: Container endpoint smoke
        if: runner.os == 'Linux'
        run: |
          docker run -d --name camopanda-ci -p 127.0.0.1:19222:9222 camopanda:check
          sleep 2
          agent-browser --session container-check --cdp ws://127.0.0.1:19222/ open https://example.com
          agent-browser --session container-check snapshot
          agent-browser --session container-check close
          docker rm -f camopanda-ci
      - name: Package release archive
        run: |
          mkdir -p dist/licenses/camopanda
          cp LICENSE dist/licenses/camopanda/
          tar -czf dist/camopanda-${{ matrix.platform }}.tar.gz -C dist camopanda camopanda-gateway lightpanda licenses browser-pins.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/camopanda-${{ matrix.platform }}.tar.gz
            dist/lightpanda-source.tar.gz
            dist/images-*.tar.gz
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish multiarchitecture images and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            gzip -dc "artifacts/build-linux-$arch/images-$arch.tar.gz" | docker load
            for image in camopanda camopanda-gateway; do
              docker tag "$image:check" "ghcr.io/paulmeller/$image:$version-$arch"
              docker push "ghcr.io/paulmeller/$image:$version-$arch"
            done
          done
          for image in camopanda camopanda-gateway; do
            docker manifest create "ghcr.io/paulmeller/$image:$version" "ghcr.io/paulmeller/$image:$version-amd64" "ghcr.io/paulmeller/$image:$version-arm64"
            docker manifest push "ghcr.io/paulmeller/$image:$version"
          done
          mkdir release
          cp artifacts/build-*/camopanda-*.tar.gz release/
          cp artifacts/build-linux-amd64/lightpanda-source.tar.gz release/
          cp browser/pins.json browser/lightpanda.patch release/
          (cd release && sha256sum * > SHA256SUMS)
          gh release create "$VERSION" release/* --title "Camopanda $version" --notes-file docs/release-notes.md --verify-tag
