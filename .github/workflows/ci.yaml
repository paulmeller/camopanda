name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path proxy/Cargo.toml --locked
      - run: cargo clippy --manifest-path proxy/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo fmt --manifest-path proxy/Cargo.toml --check
      - run: sh -n proxy/entrypoint.sh lightpanda/entrypoint.sh
      - run: docker compose config --quiet
